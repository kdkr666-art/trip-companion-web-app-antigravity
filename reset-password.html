<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf9f5"><title>Reset password · Trip Companion</title>
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="motion.css">
</head>
<body>
  <main class="reset-shell">
    <a class="auth-brand" href="/login.html"><span class="brand-mark">tc</span><span>trip companion<small>TOUR TOGETHER</small></span></a>
    <section class="reset-card">
      <div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a new password</h1>
      <p class="auth-intro">Use at least 10 characters. This one-time link expires after 10 minutes.</p>
      <form id="resetForm" class="auth-form">
        <label>New password<input name="password" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters"></label>
        <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="Enter it again"></label>
        <div class="auth-error" id="resetError" role="alert"></div>
        <button class="auth-submit" type="submit">Update password <span>→</span></button>
      </form>
      <a class="auth-link" href="/login.html">Back to sign in</a>
    </section>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
